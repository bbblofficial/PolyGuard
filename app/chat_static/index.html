<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unicollect Chat</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg-2:#f6f6f6; --text:#1b1b1b; --muted:#6b6b6b;
  --border:#e4e4e4; --accent:#e06a2c; --bubble-user:#f0f0f0; --bubble-bot:#ffffff;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1b1b; --bg-2:#222222; --text:#f1f1f1; --muted:#9a9a9a;
         --border:#333333; --bubble-user:#2a2a2a; --bubble-bot:#1b1b1b; }
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:"Vazirmatn", system-ui, sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  display:flex; align-items:center; gap:10px; padding:14px 18px;
  border-bottom:1px solid var(--border); position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;
}
.mark{width:22px;height:22px;color:var(--accent);flex:none;}
header h1{font-size:15px; font-weight:600; margin:0;}
header .tag{font-size:12px; color:var(--muted); margin-inline-start:auto;}
#dot{width:8px;height:8px;border-radius:50%;background:#c9c9c9;display:inline-block;margin-inline-end:6px;}
#dot.ok{background:#3dae5a;} #dot.bad{background:#d9534f;}
main{flex:1; overflow-y:auto; padding:18px 14px 8px;}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}
.msg{display:flex; gap:10px; max-width:92%;}
.msg.user{align-self:flex-end; flex-direction:row-reverse;}
.msg.bot{align-self:flex-start;}
.bubble{
  padding:10px 14px; border-radius:14px; line-height:1.8; font-size:14.5px;
  white-space:pre-wrap; word-break:break-word;
}
.msg.user .bubble{background:var(--bubble-user); border-top-right-radius:4px;}
.msg.bot .bubble{background:var(--bubble-bot); border:1px solid var(--border); border-top-left-radius:4px;}
.empty{color:var(--muted); text-align:center; margin-top:18vh; font-size:14px; line-height:2;}
.thinking{display:flex; gap:4px; padding:6px 2px;}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out;}
.thinking span:nth-child(2){animation-delay:.15s;} .thinking span:nth-child(3){animation-delay:.3s;}
@keyframes b{0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-3px);}}
footer{border-top:1px solid var(--border); padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));}
.composer{max-width:720px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
  border:1px solid var(--border); border-radius:16px; padding:8px 10px; background:var(--bg-2);}
textarea{flex:1; resize:none; border:0; background:transparent; color:var(--text);
  font-family:inherit; font-size:14.5px; line-height:1.6; max-height:160px; outline:none; padding:6px 4px;}
button#send{
  border:0; background:var(--accent); color:#fff; width:34px; height:34px; border-radius:10px;
  flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
button#send:disabled{opacity:.45; cursor:default;}
.foot-note{max-width:720px; margin:8px auto 0; font-size:11px; color:var(--muted); text-align:center;}
@media (prefers-reduced-motion: reduce){ .thinking span{animation:none;} }
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M12 1.5c1.9 0 2.6 2.1 1.9 4.1l-.9 2.5c-.35.95-1.65.95-2 0l-.9-2.5C9.4 3.6 10.1 1.5 12 1.5z" transform="rotate(0 12 12)"/>
    <path d="M12 1.5c1.9 0 2.6 2.1 1.9 4.1l-.9 2.5c-.35.95-1.65.95-2 0l-.9-2.5C9.4 3.6 10.1 1.5 12 1.5z" transform="rotate(60 12 12)"/>
    <path d="M12 1.5c1.9 0 2.6 2.1 1.9 4.1l-.9 2.5c-.35.95-1.65.95-2 0l-.9-2.5C9.4 3.6 10.1 1.5 12 1.5z" transform="rotate(120 12 12)"/>
    <path d="M12 1.5c1.9 0 2.6 2.1 1.9 4.1l-.9 2.5c-.35.95-1.65.95-2 0l-.9-2.5C9.4 3.6 10.1 1.5 12 1.5z" transform="rotate(180 12 12)"/>
    <path d="M12 1.5c1.9 0 2.6 2.1 1.9 4.1l-.9 2.5c-.35.95-1.65.95-2 0l-.9-2.5C9.4 3.6 10.1 1.5 12 1.5z" transform="rotate(240 12 12)"/>
    <path d="M12 1.5c1.9 0 2.6 2.1 1.9 4.1l-.9 2.5c-.35.95-1.65.95-2 0l-.9-2.5C9.4 3.6 10.1 1.5 12 1.5z" transform="rotate(300 12 12)"/>
    <circle cx="12" cy="12" r="2.1"/>
  </svg>
  <h1>Unicollect Chat</h1>
  <span class="tag"><span id="dot"></span><span id="status-text">در حال اتصال…</span></span>
</header>
<main id="main">
  <div class="wrap" id="wrap">
    <div class="empty" id="empty">با Unicollect گفتگو کن.<br>ساخته شده توسط موویکسو.</div>
  </div>
</main>
<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="پیامت را بنویس…"></textarea>
    <button id="send" title="ارسال" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12l15-8-6 8 6 8-15-8Z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="foot-note">© Unicollect · موویکسو</div>
</footer>
<script>
(function(){
  "use strict";
  var wrap = document.getElementById("wrap");
  var empty = document.getElementById("empty");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("status-text");
  var history = []; // {role, content}
  var busy = false;

  function autosize(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", function(){
    autosize();
    sendBtn.disabled = busy || !input.value.trim();
  });

  function addMessage(role, text){
    if (empty) { empty.remove(); empty = null; }
    var row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "bot");
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    wrap.appendChild(row);
    row.scrollIntoView({behavior:"smooth", block:"end"});
    return bubble;
  }

  function addThinking(){
    var row = document.createElement("div");
    row.className = "msg bot";
    var bubble = document.createElement("div");
    bubble.className = "bubble thinking";
    bubble.innerHTML = "<span></span><span></span><span></span>";
    row.appendChild(bubble);
    wrap.appendChild(row);
    row.scrollIntoView({behavior:"smooth", block:"end"});
    return row;
  }

  function revealWordByWord(bubble, text){
    var words = text.split(/(\s+)/);
    var i = 0;
    (function step(){
      if (i >= words.length) return;
      bubble.textContent += words[i++];
      wrap.lastChild.scrollIntoView({behavior:"smooth", block:"end"});
      setTimeout(step, 16);
    })();
  }

  function send(){
    var text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    addMessage("user", text);
    history.push({role:"user", content:text});
    input.value = "";
    autosize();

    var thinkingRow = addThinking();

    fetch("api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text, history: history.slice(0,-1)})
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        thinkingRow.remove();
        if (!res.ok || res.data.error){
          var b = addMessage("bot", "");
          revealWordByWord(b, res.data.error || "خطایی رخ داد.");
          return;
        }
        history.push({role:"assistant", content:res.data.reply});
        var b = addMessage("bot", "");
        revealWordByWord(b, res.data.reply);
      })
      .catch(function(){
        thinkingRow.remove();
        var b = addMessage("bot", "");
        revealWordByWord(b, "اتصال به سرویس برقرار نشد. دوباره تلاش کن.");
      })
      .finally(function(){
        busy = false;
        sendBtn.disabled = !input.value.trim();
      });
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });

  function pollHealth(){
    fetch("health", {cache:"no-store"}).then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.status === "ok"){
          dot.className = "ok"; statusText.textContent = "آنلاین";
        } else {
          dot.className = "bad"; statusText.textContent = "در حال آماده‌سازی…";
        }
      })
      .catch(function(){ dot.className = "bad"; statusText.textContent = "در دسترس نیست"; });
  }
  pollHealth();
  setInterval(pollHealth, 20000);
})();
</script>
</body>
</html>
