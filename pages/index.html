<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PolyGuard · لینک TryCloudflare</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --card:#f7f7f8; --border:rgba(0,0,0,.1); --text:#0d0d0d; --text2:#5d5d5d; --text3:#8f8f8f;
          --btn:#0d0d0d; --btnfg:#fff; --ok:#10a37f; --warn:#d98e04; --bad:#e5484d; --accent:#d97757; --ease:cubic-bezier(.22,1,.36,1); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#212121; --card:#2a2a2a; --border:rgba(255,255,255,.1); --text:#ececec; --text2:#b4b4b4; --text3:#8e8e8e;
            --btn:#fff; --btnfg:#000; --ok:#19c37d; --warn:#f5b942; --bad:#ff6369; --accent:#e08a6d; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family:'Vazirmatn',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:20px; -webkit-font-smoothing:antialiased; }
  .wrap { width:100%; max-width:620px; text-align:center; animation:rise .5s var(--ease) both; }
  .logo { width:52px; height:52px; margin:0 auto 18px; color:var(--accent); }
  .logo svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  .wrap.waiting .logo svg { animation:spin 6s linear infinite; }
  h1 { font-size:24px; font-weight:600; margin-bottom:6px; }
  .sub { color:var(--text2); font-size:14.5px; margin-bottom:26px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:20px; }
  .label { font-size:14px; color:var(--text2); margin-bottom:12px; }
  .url { display:block; direction:ltr; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:16px; word-break:break-all;
         background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:14px 16px; color:var(--text); text-decoration:none; transition:border-color .15s; }
  .url:hover { border-color:var(--accent); }
  .url.empty { color:var(--text3); font-family:inherit; direction:rtl; }
  .row { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 20px; border-radius:9999px; border:1px solid var(--border);
         background:transparent; color:var(--text); font:inherit; font-size:14px; font-weight:500; cursor:pointer; text-decoration:none; transition:background .15s, transform .12s, opacity .15s; }
  .btn:hover { background:color-mix(in srgb, var(--text) 7%, transparent); }
  .btn:active { transform:scale(.95); }
  .btn.primary { background:var(--btn); color:var(--btnfg); border-color:transparent; }
  .btn.primary:hover { opacity:.88; background:var(--btn); }
  .btn[aria-disabled="true"] { opacity:.35; pointer-events:none; }
  .meta { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:18px; font-size:12.5px; color:var(--text3); }
  .meta a { color:inherit; }
  .pill { display:inline-flex; align-items:center; gap:7px; font-size:13px; padding:4px 12px; border-radius:9999px; background:color-mix(in srgb, var(--tone,var(--text3)) 14%, transparent); color:var(--tone,var(--text3)); margin-bottom:14px; transition:background .3s, color .3s; }
  .pill i { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.live { --tone:var(--ok); } .pill.wait { --tone:var(--warn); } .pill.wait i { animation:pulse 1.3s infinite; } .pill.off { --tone:var(--bad); }
  .toast { position:fixed; top:16px; left:50%; transform:translate(-50%,-12px); opacity:0; background:var(--btn); color:var(--btnfg); padding:8px 18px; border-radius:9999px; font-size:13px; transition:opacity .2s, transform .25s var(--ease); pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <div class="logo"><svg viewBox="0 0 24 24" id="spark"></svg></div>
  <h1>PolyGuard</h1>
  <p class="sub">این صفحه خودکار از GitHub Actions به‌روز می‌شود؛ دیگر لازم نیست دنبال لینک بگردی.</p>

  <section class="card">
    <div id="pill" class="pill wait"><i></i><span id="pill-text">در حال بررسی…</span></div>
    <div class="label">لینک TryCloudflare شما اینه:</div>
    <a id="url" class="url empty" href="#" target="_blank" rel="noopener">هنوز لینکی منتشر نشده</a>
    <div class="row">
      <a id="open" class="btn primary" href="#" target="_blank" rel="noopener" aria-disabled="true">باز کردن</a>
      <button id="copy" class="btn" type="button" aria-disabled="true">کپی لینک</button>
    </div>
  </section>

  <div class="meta">
    <span id="updated"></span>
    <a id="run" href="#" target="_blank" rel="noopener" hidden>مشاهده‌ی اجرای Actions</a>
  </div>
</main>
<div id="toast" class="toast">کپی شد</div>

<script>
(function () {
  // PolyGuard brand mark: hexagon + diamond core + glowing center dot.
document.getElementById('spark').innerHTML =
  '<polygon points="12,2.2 20.5,7.1 20.5,16.9 12,21.8 3.5,16.9 3.5,7.1"/>' +
  '<polygon points="12,7.6 16.6,12 12,16.4 7.4,12" style="fill:color-mix(in srgb,currentColor 22%,transparent)"/>' +
  '<circle cx="12" cy="12" r="1.6" style="fill:currentColor;stroke:none"/>';


  var $ = function (id) { return document.getElementById(id); };
  var current = null;
  var autoGo = /[?&]go=1\b/.test(location.search);

  function setPill(cls, text) {
    $('pill').className = 'pill ' + cls;
    $('pill-text').textContent = text;
    $('wrap').classList.toggle('waiting', cls === 'wait');
  }
  function ago(iso) {
    var t = Date.parse(iso); if (!t) return '';
    var s = Math.max(0, (Date.now() - t) / 1000), fa = function (n) { return Math.floor(n).toLocaleString('fa-IR'); };
    if (s < 60) return 'همین الان';
    if (s < 3600) return fa(s / 60) + ' دقیقه پیش';
    if (s < 86400) return fa(s / 3600) + ' ساعت پیش';
    return fa(s / 86400) + ' روز پیش';
  }
  function setUrl(url) {
    var u = $('url'), o = $('open'), c = $('copy');
    if (url) {
      u.textContent = url; u.href = url; u.classList.remove('empty');
      o.href = url; o.setAttribute('aria-disabled', 'false'); c.setAttribute('aria-disabled', 'false');
    } else {
      u.textContent = 'هنوز لینکی منتشر نشده'; u.removeAttribute('href'); u.classList.add('empty');
      o.removeAttribute('href'); o.setAttribute('aria-disabled', 'true'); c.setAttribute('aria-disabled', 'true');
    }
  }
  function ping(url) {
    // the server allows cross-origin GET /health, so we can tell if it's really up
    var ctrl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 6000);
    return fetch(url.replace(/\/$/, '') + '/health', { cache: 'no-store', signal: ctrl && ctrl.signal })
      .then(function (r) { return r.json(); })
      .then(function (d) { clearTimeout(to); return d; })
      .catch(function () { clearTimeout(to); return null; });
  }

  function refresh() {
    fetch('status.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (s) {
        $('updated').textContent = s.updated_at ? 'به‌روزرسانی: ' + ago(s.updated_at) : '';
        if (s.run_url) { $('run').href = s.run_url; $('run').hidden = false; }
        if (s.status === 'starting') { setUrl(null); setPill('wait', 'سرور در حال راه‌اندازی است (دانلود و بارگذاری مدل‌ها)…'); return; }
        if (s.status === 'offline' || !s.url) { setUrl(null); setPill('off', 'سرویس خاموش است؛ workflow را دوباره اجرا کن'); return; }
        if (s.url !== current) { current = s.url; setUrl(s.url); }
        return ping(s.url).then(function (h) {
          if (h && h.status === 'ok') {
            setPill('live', 'آنلاین · ' + ((h.loaded_models || []).length) + ' مدل فعال');
            if (autoGo) { autoGo = false; location.href = s.url; }
          } else if (h) setPill('wait', 'در حال بارگذاری مدل‌ها…');
          else setPill('off', 'لینک پاسخ نمی‌دهد (شاید اجرای Actions تمام شده)');
        });
      })
      .catch(function () { setUrl(null); setPill('off', 'هنوز وضعیتی منتشر نشده'); });
  }

  $('copy').addEventListener('click', function () {
    if (!current) return;
    var done = function () { var t = $('toast'); t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(current).then(done, done); else done();
  });

  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
