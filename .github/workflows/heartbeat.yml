name: Unicollect Heartbeat

on:
  # Restart the six-hour service immediately after the deploy run ends.
  workflow_run:
    workflows: ["Unicollect Ensemble Web + Cloudflare Tunnel"]
    types: [completed]
  # Backup check in case GitHub misses/delays the workflow_run event.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: unicollect-heartbeat
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Check and restart Unicollect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          workflow="deploy.yml"

          # workflow_run is the authoritative restart signal. The schedule is
          # only a safety net and must not start a second deploy while one runs.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_CONCLUSION" = "skipped" ]; then
              echo "Deploy was skipped; no restart needed."
              exit 0
            fi
            echo "Deploy run $RUN_ID ended with: $RUN_CONCLUSION"
          fi

          # `gh run list --status` is a single-value flag, not a
          # repeatable one — passing it twice keeps only the last value.
          # Filter every non-terminal state in jq instead (not just
          # in_progress/queued: a run can briefly sit as "requested" or
          # "waiting" right after dispatch, and missing that window here
          # would let the schedule's backup tick fire a duplicate run).
          non_terminal() {
            gh run list --repo "$GH_REPO" --workflow "$workflow" \
              --limit 20 --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued"
                                  or .status == "requested" or .status == "waiting"
                                  or .status == "pending")] | length'
          }

          active=$(non_terminal)
          if [ "$active" != "0" ]; then
            echo "A deploy is already active; leaving it alone."
            exit 0
          fi

          # `gh workflow run` only enqueues a dispatch request - it does not
          # confirm GitHub actually accepted it, so a silent permission
          # problem (e.g. Settings -> Actions -> General -> Workflow
          # permissions set back to read-only) used to look like success
          # here while nothing restarted. Verify a run actually shows up,
          # and retry once before failing loudly.
          for try in 1 2; do
            echo "Starting a fresh six-hour deploy run (attempt ${try})..."
            if ! gh workflow run deploy.yml --repo "$GH_REPO" --ref main; then
              echo "::warning::gh workflow run failed on attempt ${try}"
              sleep 5
              continue
            fi
            for i in $(seq 1 10); do
              sleep 3
              [ "$(non_terminal)" != "0" ] && { echo "Confirmed: a new deploy run is queued."; exit 0; }
            done
            echo "::warning::dispatch returned success but no run appeared within 30s"
          done

          echo "::error::Could not start deploy.yml. Check Settings -> Actions -> General -> Workflow permissions (must be 'Read and write permissions') and that Actions are enabled for this repository."
          exit 1
