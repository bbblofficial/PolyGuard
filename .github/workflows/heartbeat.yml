name: Unicollect Heartbeat

on:
  # Restart the six-hour service immediately after the deploy run ends.
  workflow_run:
    workflows: ["Unicollect API Web + Cloudflare Tunnel"]
    types: [completed]
  # Backup check in case GitHub misses/delays the workflow_run event.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: unicollect-heartbeat
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Check and restart Unicollect
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          workflow="deploy.yml"

          # workflow_dispatch (manual run from the Actions tab) falls through
          # to the same active-run check below as every other trigger, so a
          # manual click can't accidentally start a second deploy in parallel
          # with one that's already healthy.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Triggered manually. Checking for an active deploy before restarting."
          fi
          # workflow_run is the authoritative restart signal.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_CONCLUSION" = "skipped" ]; then
              echo "Deploy was skipped; no restart needed."
              exit 0
            fi
            echo "Deploy run $RUN_ID ended with: $RUN_CONCLUSION"
          fi

          # Get active runs and their creation time
          active_json=$(gh run list --repo "$GH_REPO" --workflow "$workflow" \
            --limit 20 --json status,createdAt \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued"
                                or .status == "requested" or .status == "waiting"
                                or .status == "pending")]')
          
          active_count=$(echo "$active_json" | jq 'length')

          if [ "$active_count" != "0" ]; then
            echo "A deploy is already active."
            
            # Check how long it has been running
            STARTED_AT=$(echo "$active_json" | jq -r '.[0].createdAt')
            START_TS=$(date -d "$STARTED_AT" +%s)
            NOW_TS=$(date +%s)
            ELAPSED_MIN=$(( (NOW_TS - START_TS) / 60 ))

            # If it's been running for less than 270 minutes (4.5 hours), wait.
            if [ "$ELAPSED_MIN" -lt 270 ]; then
              echo "Active deploy is ${ELAPSED_MIN} minutes old. Waiting until 270 minutes to start the parallel one."
              exit 0
            else
              echo "Active deploy is ${ELAPSED_MIN} minutes old. Starting a new one in parallel for zero-downtime."
              # Continue to start the new workflow
            fi
          fi

          # Start a new run
          for try in 1 2; do
            echo "Starting a fresh deploy run (attempt ${try})..."
            if ! gh workflow run deploy.yml --repo "$GH_REPO" --ref main; then
              echo "::warning::gh workflow run failed on attempt ${try}"
              sleep 5
              continue
            fi
            
            for i in $(seq 1 10); do
              sleep 3
              new_active_count=$(gh run list --repo "$GH_REPO" --workflow "$workflow" \
                --limit 20 --json status \
                --jq '[.[] | select(.status == "in_progress" or .status == "queued"
                                    or .status == "requested" or .status == "waiting"
                                    or .status == "pending")] | length')
              if [ "$new_active_count" -gt "$active_count" ]; then
                echo "Confirmed: a new deploy run is queued."
                exit 0
              fi
            done
            echo "::warning::dispatch returned success but no new run appeared within 30s"
          done

          echo "::error::Could not start deploy.yml. Check Settings -> Actions -> General -> Workflow permissions."
          exit 1